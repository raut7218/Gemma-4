# senior-dev port: one agent, one context, no planner, reviewer or sub-agents.
# Tools match the v4.3 control config exactly, so an A/B against it measures the prompt only.
# read_file and get_code_subgraph are left out: the scorer's tool-call parser turns their
# integer/list arguments into strings, so files are read with sed/grep via run_command.
name: swe_agent
description: Implements one fix in the repository by itself and ends by calling submit_patch.
model: gemma-4-31b-it-qat-w4a16-ct
instruction: !include prompts/system.md
generate_content_config: !include configs/sampling.yaml
tools:
  - run_command
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - search_similar_code
  - get_code_neighbors
