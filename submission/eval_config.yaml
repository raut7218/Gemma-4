# The scorer runs about 120 tasks one after another inside 12 h, sandbox setup included, and an overrun fails the
# whole submission instead of scoring the unfinished tasks as zero. 10 min x 120 = 20 h is only the worst case where
# every task burns the full clock: what keeps the total inside 12 h is the 28-call cap, which ends a stuck run at its
# first text reply once spent (swegemma agent_runner). v4/v5 ran 8 min and finished; replaying the 44 local v4 traces
# at Kaggle speed puts 10 min about 1.5 h above 8 min, so this is a deliberate bet that the skill scripts (one call
# instead of several reads) shorten runs enough to pay for it.
# timeout_seconds also bounds the hidden-test run in the shipped source, so it stays at 240.
evaluation:
  timeout_seconds: 240
  max_tool_calls: 28
  max_time_minutes: 10.0
  max_turns: 80
